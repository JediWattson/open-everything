[project]
name = "open-everything"
version = "0.1.0"
description = "Decompilation harness: Ghidra headless -> function-level embeddings -> LanceDB RAG"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.21",
    "pyghidra>=2.2",
    "sentence-transformers>=3.0",
    "tabulate>=0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
oe = "openeverything.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["mlx-lm>=0.31; sys_platform == 'darwin'"]
